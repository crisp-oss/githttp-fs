# githttp-fs — default configuration.
#
# A STANDALONE node: it accepts writes, serves reads, and replicates nothing.
# This is the file the Docker image and the Debian package install as
# /etc/githttp-fs.toml, so it deliberately opens no listener and holds no
# secret beyond the API key you must change below.
#
# To run a master with a replica for development, use the two dedicated files
# instead:
#
#   cargo run -- -c config.master.toml    # master:  api :5355, replication :5356
#   cargo run -- -c config.replica.toml   # replica: api :5365, replication :5366

[server]

host = "0.0.0.0"
port = 5355

# Change this. Every content route requires it as `Authorization: Bearer`.
api_key = "MySecretAPIKey"

repos_path = "./dev/repositories/standalone"
log_level = "debug"

[limits]

allowed_extensions = ["html", "txt", "toml", "json", "md", "mdx"]

batch_read_maximum_files = 100

[hooks]

url = "https://webhook.site/c086f90d-e2d6-40dc-a925-38179cc33e8d"

events = [
  "file.created",
  "file.updated",
  "file.deleted",
  "file.moved",
  "order.updated",
  "order.deleted"
]

retry_attempts = 5
retry_backoff_ms = 2000

[hooks.auth]

header = "Authorization"
value = "Bearer your-hook-receiver-secret"

[maintenance]

enabled = true
delay_secs = 86400
