info:
  name: Count Files
  type: http
  seq: 1
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/count/files"
  params:
    - name: prefix_path
      value: "{{base_path}}"
      description: Scope the count to a sub-directory
      type: query
      disabled: true
    - name: maximum_depth
      value: "10"
      description: How many directory levels deep to count
      type: query
      disabled: true
    - name: include_hidden_files
      value: "true"
      description: Count dot-prefixed entries (default false)
      type: query
      disabled: true
    - name: restrict_file_extensions
      value: '["md", "mdx"]'
      description: Only count files with one of these extensions (JSON array)
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.files
      operator: isNumber
    - expression: res.body.directories
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Count files and directories
