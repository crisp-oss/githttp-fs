info:
  name: Rollback Commit
  type: http
  seq: 4
  tags:
    - destructive

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/commits/{{commit_sha}}/rollback"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        }
        // "message": "Roll back commit from API client"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Roll the files a commit touched back to the state they had at that commit
