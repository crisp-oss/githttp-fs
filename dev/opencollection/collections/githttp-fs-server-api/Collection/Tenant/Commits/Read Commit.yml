info:
  name: Read Commit
  type: http
  seq: 2
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/commits/{{commit_sha}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Read a commit, with its per-file diffs and snapshots
