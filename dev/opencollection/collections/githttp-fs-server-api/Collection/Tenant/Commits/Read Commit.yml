info:
  name: Read Commit
  type: http
  seq: 2
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/commits/{{commit_sha}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.sha
      operator: startsWith
      value: "{{commit_sha}}"
    - expression: res.body.files
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Read a commit, with its per-file diffs and snapshots
