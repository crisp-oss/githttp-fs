info:
  name: List Commits
  type: http
  seq: 1
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/commits"
  params:
    - name: page
      value: "1"
      description: Page number, from 1
      type: query
      disabled: true
    - name: per_page
      value: "20"
      description: Commits per page (default 100, max 500)
      type: query
      disabled: true
    - name: file_path
      value: "{{file_path}}"
      description: Only commits touching this file, following renames backward
      type: query
      disabled: true
    - name: include_statistics
      value: "true"
      description: Add per-commit insertion, deletion and files-changed counts
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.commits
      operator: isArray
    - expression: res.body.has_more
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List commits (paged, ?page=&per_page=)
