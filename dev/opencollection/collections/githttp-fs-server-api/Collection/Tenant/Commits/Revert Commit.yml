info:
  name: Revert Commit
  type: http
  seq: 3
  tags:
    - destructive

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/commits/{{commit_sha}}/revert"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        }
        // "message": "Revert commit from API client"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.commit_sha
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Revert a commit
