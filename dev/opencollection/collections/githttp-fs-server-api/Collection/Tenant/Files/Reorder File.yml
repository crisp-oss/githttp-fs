info:
  name: Reorder File
  type: http
  seq: 6
  tags:
    - write

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}/reorder"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        },
        "position": 0
        // "implicit_order_default_index": -1,
        // "implicit_allow_hidden_files": true,
        // "message": "Reorder file from API client",
        // "allow_prefix_path": true
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.commit_sha
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Re-order a file or folder in its parent (using a numerical position)
