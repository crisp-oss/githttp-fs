info:
  name: Move File
  type: http
  seq: 5
  tags:
    - write

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}/move"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        },
        "destination": "{{directory_path}}/moved-{{file_name}}"
        // "message": "Move file from API client",
        // "allow_prefix_path_recurse": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Move / rename a file
