info:
  name: Write File
  type: http
  seq: 4
  tags:
    - write

http:
  method: PUT
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        },
        "content": "title = \"Category Name\"\ndescription = \"Install the Mailchimp plugin from the Crisp Dashboard.\"\npublished = true\nhidden = false\nfeatured = false"
        // "message": "Write file from API client"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Create or update a file
