info:
  name: List Files
  type: http
  seq: 1
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files"
  params:
    - name: prefix_path
      value: "{{base_path}}"
      description: Scope the listing to a sub-directory
      type: query
      disabled: true
    - name: maximum_depth
      value: "1"
      description: How many directory levels deep to list
      type: query
      disabled: true
    - name: include_hidden_files
      value: "true"
      description: Include dot-prefixed entries (default false)
      type: query
      disabled: true
    - name: file_name_starts_with
      value: '["how-to"]'
      description: Keep files and directories whose leaf name starts with a prefix, case-insensitively (bare string or JSON array)
      type: query
      disabled: true
    - name: file_paths
      value: '["how-to-use-crisp.md"]'
      description: Select exactly these paths, relative to prefix_path (bare string or JSON array); not combinable with file_name_starts_with
      type: query
      disabled: true
    - name: include_date_from
      value: "2026-09-20T10:00:00.000Z"
      description: Keep files whose date is at or after this RFC 3339 date-time
      type: query
      disabled: true
    - name: include_date_to
      value: "2026-12-01T10:00:00.000Z"
      description: Keep files whose date is before this RFC 3339 date-time
      type: query
      disabled: true
    - name: include_date_type
      value: updated
      description: Which git date the window compares, updated (default) or created
      type: query
      disabled: true
    - name: apply_order_index
      value: "true"
      description: Order every level by its directory's order index (default false)
      type: query
      disabled: true
    - name: implicit_order_default_index
      value: "-1"
      description: Index held by entries the order index does not name; 0 or -1 lists them first, unset lists them last
      type: query
      disabled: true
    - name: page
      value: "1"
      description: Page over the root-level entries, from 1
      type: query
      disabled: true
    - name: per_page
      value: "100"
      description: Root-level entries per page (default 100, max 500)
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.files
      operator: isArray
    - expression: res.body.page
      operator: isNumber
    - expression: res.body.has_more
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: List all tracked files (path + size)
