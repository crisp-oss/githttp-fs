info:
  name: Delete File
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{authorization}}"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        },
        "allow_prefix_path_recurse": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Delete a file
