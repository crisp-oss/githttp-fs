info:
  name: Delete File
  type: http
  seq: 7
  tags:
    - destructive

http:
  method: DELETE
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        }
        // "message": "Delete file from API client",
        // "allow_prefix_path_recurse": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Delete a file
