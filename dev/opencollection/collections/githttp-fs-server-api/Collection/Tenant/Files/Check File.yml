info:
  name: Check File
  type: http
  seq: 2
  tags:
    - read

http:
  method: HEAD
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}?check_prefix_path=true"
  params:
    - name: check_prefix_path
      value: "true"
      description: Count a folder at this path as existing too (default false)
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Check that a file exists (or a folder, with check_prefix_path)
