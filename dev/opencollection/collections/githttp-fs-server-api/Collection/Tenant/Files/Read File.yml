info:
  name: Read File
  type: http
  seq: 3

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}"
  headers:
    - name: Authorization
      value: "{{authorization}}"
  params:
    - name: seek_from_line_starts_with
      value: '["---", "+++"]'
      type: query
      disabled: true
    - name: seek_to_line_starts_with
      value: $seek_from_line_starts_with
      type: query
      disabled: true
    - name: seek_lines_maximum
      value: "100"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Read a file's raw content
