info:
  name: Read File
  type: http
  seq: 3
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/files/{{file_path}}"
  params:
    - name: seek_from_line_starts_with
      value: '["---", "+++"]'
      description: Start the window at the first line starting with any of these prefixes (JSON array)
      type: query
      disabled: true
    - name: seek_to_line_starts_with
      value: $seek_from_line_starts_with
      description: End the window at the next line starting with any of these prefixes (JSON array), or $seek_from_line_starts_with for the marker that opened it
      type: query
      disabled: true
    - name: seek_lines_maximum
      value: "100"
      description: Cap the window to this many lines (at least 1)
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Read a file's raw content
