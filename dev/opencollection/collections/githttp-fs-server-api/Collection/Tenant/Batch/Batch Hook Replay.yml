info:
  name: Batch Hook Replay
  type: http
  seq: 2

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/batch/replay/hook"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: seek_from_line_starts_with
      value: '["---", "+++"]'
      type: query
      disabled: true
    - name: seek_to_line_starts_with
      value: $seek_from_line_starts_with
      type: query
      disabled: true
    - name: seek_lines_maximum
      value: "100"
      type: query
      disabled: true
  body:
    type: json
    data: |-
      {
        "direction": "create",
        "delay_ms": 200,
        "include_hidden_files": true,
        "prefix_path": "{{directory_path}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Re-play hooks for deletions, based on list of files the external state has
