info:
  name: Batch Hook Replay
  type: http
  seq: 2
  tags:
    - destructive

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/batch/replay/hook"
  body:
    type: json
    data: |-
      {
        "direction": "create"
        // "files": ["{{file_path}}"],
        // "prefix_path": "{{directory_path}}",
        // "include_hidden_files": true,
        // "delay_ms": 200
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.commit_sha
      operator: isString
    - expression: res.body.files
      operator: isNumber
    - expression: res.body.orders
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Replay file hooks to reconcile a downstream mirror with the files it holds
