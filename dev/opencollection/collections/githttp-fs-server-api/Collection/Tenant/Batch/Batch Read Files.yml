info:
  name: Batch Read Files
  type: http
  seq: 1
  tags:
    - read

http:
  method: POST
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/batch/files/read"
  body:
    type: json
    data: |-
      {
        "files": [
          "{{file_path}}",
          "this/file/does/not/exist.md",
          {
            "path": "this/file/has/custom/path.md",
            "seek": {
              "lines_maximum": 10
            }
          }
        ]
        // "seek": {
        //   "from_line_starts_with": ["---", "+++"],
        //   "to_line_starts_with": "$seek_from_line_starts_with",
        //   "lines_maximum": 100
        // }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.files
      operator: length
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Read multiple files raw content
