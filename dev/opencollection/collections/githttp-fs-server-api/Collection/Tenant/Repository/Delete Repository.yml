info:
  name: Delete Repository
  type: http
  seq: 1
  tags:
    - destructive

http:
  method: DELETE
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.deleted
      operator: eq
      value: "{{tenant_id}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Delete an entire tenant repository
