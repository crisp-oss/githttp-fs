http:
  method: PUT
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/order/{{directory_path}}"
  body:
    type: json
    data: |-
      {
        "author": {
          "name": "{{author_name}}",
          "email": "{{author_email}}"
        },
        "order": [
          "how-to-import-export-analytics-dashboards.md",
          "how-to-create-custom-analytics-reports-with-the-analytics-dashboard.md"
        ]
        // "allow_hidden_files": true,
        // "message": "Write order index from API client"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

