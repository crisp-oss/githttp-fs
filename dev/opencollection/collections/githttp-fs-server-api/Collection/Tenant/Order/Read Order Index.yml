http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/order/{{directory_path}}"
  headers:
    - name: Authorization
      value: "{{authorization}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

