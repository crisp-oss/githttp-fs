info:
  name: Read Order Index
  type: http
  seq: 1
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}/{{collection}}/{{tenant_id}}/order/{{directory_path}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.directory
      operator: eq
      value: "{{directory_path}}"
    - expression: res.body.order
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Read a directory files order index
