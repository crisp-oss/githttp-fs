info:
  name: Ping All Servers
  type: http
  seq: 2

http:
  method: GET
  url: "{{endpoint}}/ping/all"
  headers:
    - name: Authorization
      value: "{{authorization}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Ping this server and every peer server it is configured with, reporting whether each is up.
