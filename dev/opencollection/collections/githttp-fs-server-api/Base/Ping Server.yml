info:
  name: Ping Server
  type: http
  seq: 1
  tags:
    - read

http:
  method: GET
  url: "{{endpoint}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.pong
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Check if Git HTTP FS server is up and authentication works OK.
