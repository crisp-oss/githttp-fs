info:
  name: Get Replication Health
  type: http
  seq: 2
  tags:
    - read
    - public

http:
  method: GET
  url: "{{endpoint}}/_health/replication"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: isString
    - expression: res.body.issues
      operator: isArray
    - expression: res.body.node.role
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Acquires the replication health of the server (public route).
