info:
  name: Get General Health
  type: http
  seq: 1
  tags:
    - read
    - public

http:
  method: GET
  url: "{{endpoint}}/_health/status"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: isString
    - expression: res.body.role
      operator: isString
    - expression: res.body.writable
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Acquires the general health status of the server (public route).
