opencollection: 1.0.0

info:
  name: GitHTTP FS (Server API)
  version: v1
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{api_key}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

docs: |-
  # githttp-fs Server API

  Every route of the githttp-fs content API, as documented in `API.md`. Pick an environment and set its secret `api_key`: **Local Master** or **Local Replica** for the dev ports (`5355`, `5365`), or **SSH Tunnel Master** or **SSH Tunnel Replica** for the same nodes forwarded over SSH (`15355`, `15365`). Every request inherits Bearer auth from it, and only the `Health` routes ignore it. Writes to a replica answer `423`.

  - **Optional query parameters** are listed with an illustrative value and disabled. Tick one to send it.
  - **Optional body keys** follow the required ones as `//` comment lines. Uncomment one to send it, and fix up the commas by hand.
  - **Tags** say what a request does to the repository. `read` changes nothing, `write` commits, `destructive` removes content or rewrites it from history (or, for the hook replay, fires webhooks downstream). `public` needs no API key.
  - **Assertions** check every response's status and documented shape. Run the collection (or the `read` requests only, which are safe against any server) to smoke-test a node.

  The `/_replication/*` peer protocol is not part of this collection. It is served on a separate listener behind its own secret.
